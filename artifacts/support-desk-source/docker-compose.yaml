x-app: &app
  image: support-desk:${VERSION:-local}
  build:
    context: .
    args:
      VERSION: ${VERSION:-local}
  read_only: true
  cap_drop: [ ALL ]
  security_opt: [ no-new-privileges:true ]
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-support}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-support}?sslmode=disable
    PORT: "8080"
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
    QUERY_TIMEOUT: ${QUERY_TIMEOUT:-5s}
    SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-15s}
    SESSION_DURATION: ${SESSION_DURATION:-24h}
    SECURE_COOKIE: ${SECURE_COOKIE:-false}
    OPERATOR_INVITE_CODE: ${OPERATOR_INVITE_CODE:-}

services:
  db:
    image: postgres:18.0-alpine3.22@sha256:48c8ad3a7284b82be4482a52076d47d879fd6fb084a1cbfccbd551f9331b0e40
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-support}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"' ]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"

  migrate:
    <<: *app
    command: [ migrate ]
    depends_on:
      db:
        condition: service_healthy

  seed:
    <<: *app
    command: [ seed ]
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    <<: *app
    ports:
      - "${PORT:-8080}:8080"
    healthcheck:
      test: [ CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/readyz ]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 5s
    stop_grace_period: 20s
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
