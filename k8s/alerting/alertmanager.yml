# Public configuration. Set your numeric Telegram chat ID below.
# The bot token is mounted separately from Secret alertmanager-telegram.
global:
  resolve_timeout: 5m
route:
  receiver: telegram
  group_by: [service, environment, alertname, severity]
  group_wait: 30s
  group_interval: 1m
  repeat_interval: 4h
receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/bot-token
        chat_id: -5591543093 # Replace with your chat ID
        send_resolved: true
        parse_mode: ''
        message: |-
          {{ .Status | toUpper }} | {{ .CommonLabels.alertname }}
          {{ .CommonLabels.service }} / {{ .CommonLabels.environment }} / {{ .CommonLabels.severity }}
          {{ range .Alerts }}
          {{ .Status | toUpper }} | profile={{ .Labels.profile }}{{ if .Labels.pod }} | pod={{ .Labels.pod }}{{ end }}
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          Действия: {{ .Annotations.runbook }}
          {{ end }}
