# Delivery test using real exported metrics; not a resource-pressure simulation.
groups:
  - name: support-runtime
    interval: 15s
    rules:
      - alert: SupportGoGoroutinesHigh
        expr: go_goroutines{job="support-desk",namespace="support-desk"} > 0
        for: 2m
        labels:
          severity: warning
          service: support-desk
          environment: minikube
          profile: demo
        annotations:
          summary: "ДЕМО: проверка доставки алерта goroutine"
          description: 'Pod {{ $labels.pod }}: {{ $value }} goroutine; демонстрационный порог 0, удержание 2 минуты. Это проверка доставки, а не свидетельство утечки.'
          runbook: "Сравните число goroutine с нагрузкой и временем ответа сервиса. Проверьте таймауты запросов и ожидание соединений с PostgreSQL."
      - alert: SupportProcessMemoryHigh
        expr: process_resident_memory_bytes{job="support-desk",namespace="support-desk"} > 0
        for: 2m
        labels:
          severity: warning
          service: support-desk
          environment: minikube
          profile: demo
        annotations:
          summary: "ДЕМО: проверка доставки алерта памяти"
          description: 'Pod {{ $labels.pod }}: RSS {{ $value | humanize1024 }}B; демонстрационный порог 0 B, удержание 2 минуты. Это проверка доставки, а не нехватка памяти.'
          runbook: "Проверьте потребление памяти и рестарты указанного Pod, включая OOMKilled. Сопоставьте рост RSS с нагрузкой и последним развёртыванием."
