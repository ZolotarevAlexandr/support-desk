apiVersion: v1
kind: ConfigMap
metadata:
  name: support-config
  namespace: support-desk
data:
  POSTGRES_USER: "support"
  POSTGRES_DB: "support"
  PORT: "8080"
  METRICS_PORT: "9090"
  LOG_LEVEL: "info"
  DEPLOYMENT_ENVIRONMENT: "minikube"
  DB_POOL_SIZE: "20"
  QUERY_TIMEOUT: "5s"
  SHUTDOWN_TIMEOUT: "15s"
  SESSION_DURATION: "24h"
  SECURE_COOKIE: "false"
  LAB_FAULT_RATE: "0"
  LAB_FAULT_DELAY: "0s"
