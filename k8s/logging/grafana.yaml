apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: logging
spec:
  selector:
    app: grafana
  ports:
  - name: http
    port: 3000
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: logging
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: grafana
        image: grafana/grafana:12.2.0
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: GF_PLUGINS_PREINSTALL_SYNC
          value: victoriametrics-logs-datasource@0.32.0
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: password
        - name: GF_USERS_ALLOW_SIGN_UP
          value: 'false'
        - name: GF_ANALYTICS_REPORTING_ENABLED
          value: 'false'
        - name: GF_ANALYTICS_CHECK_FOR_UPDATES
          value: 'false'
        - name: GF_LOG_MODE
          value: console
        - name: GF_LOG_CONSOLE_FORMAT
          value: json
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
        - name: provisioning
          mountPath: /etc/grafana/provisioning/datasources/logs.yaml
          subPath: datasources.yaml
          readOnly: true
        - name: provisioning
          mountPath: /etc/grafana/provisioning/dashboards/logs.yaml
          subPath: dashboards.yaml
          readOnly: true
        - name: provisioning
          mountPath: /var/lib/grafana/dashboards/support-logs.json
          subPath: support-logs.json
          readOnly: true
      volumes:
      - name: data
        emptyDir: {}
      - name: provisioning
        configMap:
          name: grafana-provisioning
