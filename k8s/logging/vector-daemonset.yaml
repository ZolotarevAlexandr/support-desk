apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: logging
spec:
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
    spec:
      serviceAccountName: vector
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: vector
        image: timberio/vector:0.51.1-debian
        args:
        - --config
        - /etc/vector/vector.yaml
        env:
        - name: VECTOR_SELF_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /etc/vector
          readOnly: true
        - name: logs
          mountPath: /var/log
          readOnly: true
        - name: docker-logs
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: data
          mountPath: /var/lib/vector
      volumes:
      - name: config
        configMap:
          name: vector-config
      - name: logs
        hostPath:
          path: /var/log
          type: Directory
      - name: docker-logs
        hostPath:
          path: /var/lib/docker/containers
          type: DirectoryOrCreate
      - name: data
        hostPath:
          path: /var/lib/support-logs-vector
          type: DirectoryOrCreate
