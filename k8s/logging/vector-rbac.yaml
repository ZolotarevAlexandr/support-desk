apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: support-logs-vector
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - namespaces
  - nodes
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: support-logs-vector
subjects:
- kind: ServiceAccount
  name: vector
  namespace: logging
roleRef:
  kind: ClusterRole
  name: support-logs-vector
  apiGroup: rbac.authorization.k8s.io
