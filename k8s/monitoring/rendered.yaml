---
# Source: victoria-metrics-single/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  labels: 
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: victoria-metrics-single-0.49.0
  name: victoria-metrics
  namespace: monitoring
---
# Source: victoria-metrics-single/templates/scrape-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: victoria-metrics-scrapeconfig
  namespace: monitoring
  labels: 
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: vm-single
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: victoria-metrics-single
    app.kubernetes.io/version: v1.154.0
    helm.sh/chart: victoria-metrics-single-0.49.0
data:
  scrape.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 5s
    scrape_configs:
    - job_name: support-desk
      kubernetes_sd_configs:
      - namespaces:
          names:
          - support-desk
        role: pod
      relabel_configs:
      - action: keep
        regex: support-app
        source_labels:
        - __meta_kubernetes_pod_label_app
      - action: keep
        regex: "true"
        source_labels:
        - __meta_kubernetes_pod_annotation_prometheus_io_scrape
      - action: keep
        regex: Running
        source_labels:
        - __meta_kubernetes_pod_phase
      - action: drop
        regex: "true"
        source_labels:
        - __meta_kubernetes_pod_container_init
      - action: keep_if_equal
        source_labels:
        - __meta_kubernetes_pod_annotation_prometheus_io_port
        - __meta_kubernetes_pod_container_port_number
      - source_labels:
        - __meta_kubernetes_pod_annotation_prometheus_io_path
        target_label: __metrics_path__
      - regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        source_labels:
        - __address__
        - __meta_kubernetes_pod_annotation_prometheus_io_port
        target_label: __address__
      - source_labels:
        - __meta_kubernetes_namespace
        target_label: namespace
      - source_labels:
        - __meta_kubernetes_pod_name
        target_label: pod
      - source_labels:
        - __meta_kubernetes_pod_container_name
        target_label: container
    - job_name: postgres
      kubernetes_sd_configs:
      - namespaces:
          names:
          - support-desk
        role: pod
      relabel_configs:
      - action: keep
        regex: postgres
        source_labels:
        - __meta_kubernetes_pod_label_app
      - action: keep
        regex: "true"
        source_labels:
        - __meta_kubernetes_pod_annotation_prometheus_io_scrape
      - action: keep
        regex: Running
        source_labels:
        - __meta_kubernetes_pod_phase
      - action: drop
        regex: "true"
        source_labels:
        - __meta_kubernetes_pod_container_init
      - action: keep_if_equal
        source_labels:
        - __meta_kubernetes_pod_annotation_prometheus_io_port
        - __meta_kubernetes_pod_container_port_number
      - source_labels:
        - __meta_kubernetes_pod_annotation_prometheus_io_path
        target_label: __metrics_path__
      - regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        source_labels:
        - __address__
        - __meta_kubernetes_pod_annotation_prometheus_io_port
        target_label: __address__
      - source_labels:
        - __meta_kubernetes_namespace
        target_label: namespace
      - source_labels:
        - __meta_kubernetes_pod_name
        target_label: pod
      - source_labels:
        - __meta_kubernetes_pod_container_name
        target_label: container
