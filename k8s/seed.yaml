apiVersion: batch/v1
kind: Job
metadata:
  name: support-seed
  namespace: support-desk
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app: support-seed
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: support-desk:metrics-v1
          imagePullPolicy: IfNotPresent
          args: ["seed"]
          envFrom:
            - configMapRef:
                name: support-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: support-secret
                  key: DATABASE_URL
            - name: SHUTDOWN_TIMEOUT
              value: 60s
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
